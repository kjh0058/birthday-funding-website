<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 선물 조르기 펀딩 | B-Day Funding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-12">
  <div id="app" class="max-w-xl mx-auto px-4 py-8"></div>

  <script>
    // Firebase 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyDHWpJ8cgpXoB2z04tUFxOLCQz5CH93vbU",
      authDomain: "birthday-funding-76521.firebaseapp.com",
      databaseURL: "https://birthday-funding-76521-default-rtdb.firebaseio.com",
      projectId: "birthday-funding-76521",
      storageBucket: "birthday-funding-76521.firebasestorage.app",
      messagingSenderId: "623358878820",
      appId: "1:623358878820:web:8f502ff6729295de18eb71",
      measurementId: "G-63BJFBH2WV"
    };

    // Firebase 초기화
    let db, auth;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.error("Firebase 초기화 오류:", e);
    }

    let currentUser = null;
    let allFundings = [];
    let currentTab = 'all'; // 'all': 전체 펀딩, 'my': 내 펀딩
    let isCreating = false;
    let editingFundingId = null;
    let viewingDetailId = null;

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (auth) {
        auth.onAuthStateChanged(user => {
          currentUser = user;
          loadAllFundings();
        });
      } else {
        loadAllFundings();
      }
    });

    async function loginWithGoogle() {
      if (!auth) {
        alert("Firebase 인증 모듈을 불러오지 못했습니다.");
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        alert("로그인 실패: " + err.message);
      }
    }

    async function logout() {
      if (auth) await auth.signOut();
      currentUser = null;
      editingFundingId = null;
      isCreating = false;
      viewingDetailId = null;
      render();
    }

    // 모든 펀딩 데이터 불러오기
    async function loadAllFundings() {
      if (!db) return;
      try {
        const snapshot = await db.collection('fundings').get();
        allFundings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } catch (e) {
        console.error("데이터 로드 실패:", e);
        allFundings = [];
      }
      render();
    }

    // 새 펀딩 생성
    async function createFunding(e) {
      e.preventDefault();
      if (!currentUser) {
        alert("로그인이 필요합니다.");
        return;
      }
      const title = document.getElementById('giftTitle').value;
      const amount = parseInt(document.getElementById('giftAmount').value, 10);
      const bank = document.getElementById('bankName').value;
      const account = document.getElementById('accountNumber').value;
      const holder = document.getElementById('accountHolder').value;

      if (!title || !amount || !bank || !account) {
        alert("모든 필수 항목을 입력해 주세요.");
        return;
      }

      const newFunding = {
        uid: currentUser.uid,
        userName: currentUser.displayName || "익명",
        userEmail: currentUser.email,
        title,
        targetAmount: amount,
        currentAmount: 0,
        status: 'active',
        bankName: bank,
        accountNumber: account,
        accountHolder: holder,
        contributors: [], // { name, amount, message, uid }
        createdAt: new Date().toISOString()
      };

      try {
        await db.collection('fundings').add(newFunding);
        await loadAllFundings();
        isCreating = false;
      } catch (err) {
        alert("저장 실패: " + err.message);
      }
      render();
    }

    // 펀딩 수정 제출
    async function updateFunding(e, id) {
      e.preventDefault();
      const title = document.getElementById('editTitle').value;
      const amount = parseInt(document.getElementById('editAmount').value, 10);
      const bank = document.getElementById('editBank').value;
      const account = document.getElementById('editAccount').value;
      const holder = document.getElementById('editHolder').value;

      if (!title || !amount || !bank || !account) {
        alert("모든 필수 항목을 입력해 주세요.");
        return;
      }

      try {
        await db.collection('fundings').doc(id).update({
          title,
          targetAmount: amount,
          bankName: bank,
          accountNumber: account,
          accountHolder: holder
        });
        await loadAllFundings();
        editingFundingId = null;
      } catch (err) {
        alert("수정 실패: " + err.message);
      }
      render();
    }

    // 펀딩 종료 상태 변경
    async function toggleCloseFunding(id, currentStatus) {
      const nextStatus = currentStatus === 'closed' ? 'active' : 'closed';
      if (!confirm(`정말로 이 펀딩을 ${nextStatus === 'closed' ? '종료' : '재개'}하시겠습니까?`)) return;

      try {
        await db.collection('fundings').doc(id).update({ status: nextStatus });
        await loadAllFundings();
      } catch (err) {
        alert("상태 변경 실패: " + err.message);
      }
    }

    // 펀딩 삭제
    async function deleteFunding(id) {
      if (!confirm("이 펀딩을 삭제하시겠습니까?")) return;
      try {
        await db.collection('fundings').doc(id).delete();
        await loadAllFundings();
      } catch (err) {
        alert("삭제 실패: " + err.message);
      }
    }

    // 후원 참여 제출
    async function contributeFunding(e, fundingId) {
      e.preventDefault();
      const name = document.getElementById('contributorName').value;
      const amount = parseInt(document.getElementById('contributorAmount').value, 10);
      const message = document.getElementById('contributorMessage').value;

      if (!name || !amount) {
        alert("이름과 후원 금액을 입력해 주세요.");
        return;
      }

      const fundingRef = db.collection('fundings').doc(fundingId);
      try {
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(fundingRef);
          if (!doc.exists) throw new Error("펀딩이 존재하지 않습니다.");

          const data = doc.data();
          const contributors = data.contributors || [];
          const newCurrentAmount = (data.currentAmount || 0) + amount;

          contributors.push({
            name,
            amount,
            message: message || "생일 축하해!",
            uid: currentUser ? currentUser.uid : 'guest',
            createdAt: new Date().toISOString()
          });

          transaction.update(fundingRef, {
            currentAmount: newCurrentAmount,
            contributors: contributors
          });
        });

        alert("성공적으로 후원(참여)되었습니다!");
        await loadAllFundings();
      } catch (err) {
        alert("후원 실패: " + err.message);
      }
      render();
    }

    // 화면 렌더링
    function render() {
      const container = document.getElementById('app');
      
      // 상세 보기 화면인 경우
      if (viewingDetailId) {
        const item = allFundings.find(f => f.id === viewingDetailId);
        if (!item) {
          viewingDetailId = null;
          render();
          return;
        }

        const isOwner = currentUser && currentUser.uid === item.uid;
        const pct = Math.min(100, Math.round((item.currentAmount / item.targetAmount) * 100));

        container.innerHTML = `
          <div class="space-y-6">
            <button onclick="viewingDetailId = null; render();" class="text-sm font-semibold text-slate-500 hover:text-slate-800 flex items-center gap-1">
              <i data-lucide="arrow-left" class="w-4 h-4"></i> 목록으로 돌아가기
            </button>

            <div class="bg-white rounded-3xl p-6 shadow-xl border border-slate-100 space-y-6">
              <div class="flex justify-between items-start">
                <div>
                  <span class="inline-block ${item.status === 'closed' ? 'bg-slate-200 text-slate-600' : 'bg-pink-100 text-pink-600'} text-xs font-bold px-2.5 py-1 rounded-full mb-1">
                    ${item.status === 'closed' ? '종료된 펀딩' : '진행 중'}
                  </span>
                  <h2 class="text-2xl font-bold text-slate-800">${item.title}</h2>
                  <p class="text-xs text-slate-400 mt-1">주최자: ${item.userName}</p>
                </div>
                <div class="text-right">
                  <div class="text-2xl font-bold text-pink-500">${pct}%</div>
                  <div class="text-xs text-slate-400">${item.currentAmount.toLocaleString()}원 / ${item.targetAmount.toLocaleString()}원</div>
                </div>
              </div>

              <!-- 프로그레스 바 -->
              <div class="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                <div class="bg-pink-500 h-full transition-all duration-500" style="width: ${pct}%"></div>
              </div>

              <!-- 계좌 정보 (주최자에게만 또는 후원 안내용) -->
              <div class="bg-pink-50 border border-pink-100 p-4 rounded-2xl space-y-2">
                <div class="text-xs font-bold text-pink-600 flex items-center gap-1">
                  <i data-lucide="credit-card" class="w-4 h-4"></i> 송금 계좌 안내
                </div>
                <div class="flex justify-between items-center text-sm">
                  <span class="font-semibold text-slate-700">${item.bankName} ${item.accountNumber} (예금주: ${item.accountHolder})</span>
                  <button onclick="navigator.clipboard.writeText('${item.accountNumber}'); alert('계좌번호가 복사되었습니다!');" class="bg-pink-500 text-white text-xs px-3 py-1.5 rounded-lg hover:bg-pink-600 transition">복사</button>
                </div>
              </div>

              <!-- 후원자 목록 (금액은 주최자만 열람 가능!) -->
              <div class="space-y-3">
                <h3 class="font-bold text-slate-700 text-sm flex items-center gap-1">
                  <i data-lucide="message-square" class="w-4 h-4 text-pink-500"></i> 축하 메시지 및 후원 현황
                </h3>
                <div class="space-y-2 max-h-60 overflow-y-auto">
                  ${(!item.contributors || item.contributors.length === 0) ? `
                    <p class="text-xs text-slate-400 text-center py-4 bg-slate-50 rounded-xl">아직 참여한 친구가 없습니다. 첫 번째로 축하를 남겨보세요!</p>
                  ` : item.contributors.map(c => `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 flex justify-between items-center">
                      <div>
                        <div class="font-bold text-xs text-slate-700">${c.name}</div>
                        <div class="text-xs text-slate-600 mt-0.5">"${c.message}"</div>
                      </div>
                      <div class="text-right">
                        ${isOwner ? `
                          <span class="text-xs font-bold text-pink-500 bg-pink-50 px-2 py-1 rounded-md border border-pink-100">${c.amount.toLocaleString()}원</span>
                        ` : `
                          <span class="text-xs text-slate-400 bg-slate-200/60 px-2 py-1 rounded-md">후원 완료 🎁</span>
                        `}
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 후원 참여 폼 (펀딩 진행 중일 때만) -->
              ${item.status !== 'closed' ? `
                <form onsubmit="contributeFunding(event, '${item.id}')" class="bg-slate-50 p-4 rounded-2xl border border-slate-200 space-y-3">
                  <h4 class="text-xs font-bold text-slate-700">이 펀딩에 참여하기 (후원 및 메시지)</h4>
                  <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="contributorName" placeholder="내 이름 (닉네임)" class="px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white" required />
                    <input type="number" id="contributorAmount" placeholder="후원 금액 (원)" class="px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white" required />
                  </div>
                  <input type="text" id="contributorMessage" placeholder="따뜻한 생일 축하 메시지를 남겨주세요!" class="w-full px-3 py-2 text-xs rounded-xl border border-slate-200 bg-white" />
                  <button type="submit" class="w-full bg-pink-500 hover:bg-pink-600 text-white font-bold text-xs py-2.5 rounded-xl transition shadow-sm">후원 금액 송금 완료 & 메시지 남기기</button>
                </form>
              ` : `
                <div class="bg-slate-100 text-center text-xs text-slate-500 py-3 rounded-xl font-medium">종료된 펀딩입니다.</div>
              `}
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 수정 화면인 경우
      if (editingFundingId) {
        const item = allFundings.find(f => f.id === editingFundingId);
        container.innerHTML = `
          <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100 mt-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-slate-800">펀딩 수정하기</h2>
              <button onclick="editingFundingId = null; render();" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
            <form onsubmit="updateFunding(event, '${item.id}')" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">원하는 선물 이름</label>
                <input type="text" id="editTitle" value="${item.title}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">선물 총 가격 (원)</label>
                <input type="number" id="editAmount" value="${item.targetAmount}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">은행</label>
                  <input type="text" id="editBank" value="${item.bankName}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">예금주</label>
                  <input type="text" id="editHolder" value="${item.accountHolder}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">계좌번호</label>
                <input type="text" id="editAccount" value="${item.accountNumber}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div class="pt-4 flex gap-3">
                <button type="button" onclick="editingFundingId = null; render();" class="w-1/2 bg-slate-100 text-slate-600 font-medium py-3 rounded-xl hover:bg-slate-200 transition text-sm">취소</button>
                <button type="submit" class="w-1/2 bg-pink-500 text-white font-semibold py-3 rounded-xl hover:bg-pink-600 shadow-md shadow-pink-200 transition text-sm">수정 완료</button>
              </div>
            </form>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 생성 화면인 경우
      if (isCreating) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100 mt-6">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-slate-800">새 생일 선물 펀딩 만들기</h2>
              <button onclick="isCreating = false; render();" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
            <form onsubmit="createFunding(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">원하는 선물 이름</label>
                <input type="text" id="giftTitle" placeholder="예: 소니 헤드폰 WH-1000XM5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">선물 총 가격 (원)</label>
                <input type="number" id="giftAmount" placeholder="50000" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">입금 받을 은행</label>
                  <input type="text" id="bankName" placeholder="카카오뱅크" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">예금주</label>
                  <input type="text" id="accountHolder" placeholder="김지홍" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">계좌번호</label>
                <input type="text" id="accountNumber" placeholder="3333-01-2345678" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm" required />
              </div>
              <div class="pt-4 flex gap-3">
                <button type="button" onclick="isCreating = false; render();" class="w-1/2 bg-slate-100 text-slate-600 font-medium py-3 rounded-xl hover:bg-slate-200 transition text-sm">취소</button>
                <button type="submit" class="w-1/2 bg-pink-500 text-white font-semibold py-3 rounded-xl hover:bg-pink-600 shadow-md shadow-pink-200 transition text-sm">게시하기</button>
              </div>
            </form>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 메인 대시보드 화면
      const displayedList = currentTab === 'all' 
        ? allFundings 
        : allFundings.filter(f => currentUser && f.uid === currentUser.uid);

      container.innerHTML = `
        <div class="space-y-6">
          <!-- 상단 유저 바 -->
          <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
            ${currentUser ? `
              <div class="flex items-center gap-3">
                <img src="${currentUser.photoURL || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full border" />
                <div>
                  <div class="font-bold text-slate-800 text-sm">${currentUser.displayName || '사용자'}님</div>
                  <div class="text-xs text-slate-400">${currentUser.email}</div>
                </div>
              </div>
              <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 underline">로그아웃</button>
            ` : `
              <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-pink-100 rounded-full flex items-center justify-center text-pink-500">
                  <i data-lucide="gift" class="w-4 h-4"></i>
                </div>
                <span class="text-xs font-bold text-slate-700">로그인하고 펀딩을 만들어보세요!</span>
              </div>
              <button onclick="loginWithGoogle()" class="bg-pink-500 text-white text-xs font-bold py-2 px-3 rounded-xl hover:bg-pink-600 transition">구글 로그인</button>
            `}
          </div>

          <!-- 탭 메뉴 & 새 펀딩 버튼 -->
          <div class="flex justify-between items-center">
            <div class="flex gap-2">
              <button onclick="currentTab = 'all'; render();" class="px-4 py-2 rounded-xl text-xs font-bold transition ${currentTab === 'all' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}">
                전체 펀딩 보기
              </button>
              <button onclick="currentTab = 'my'; render();" class="px-4 py-2 rounded-xl text-xs font-bold transition ${currentTab === 'my' ? 'bg-slate-800 text-white shadow-md' : 'bg-white text-slate-600 border border-slate-200'}">
                내 펀딩 관리
              </button>
            </div>
            ${currentUser ? `
              <button onclick="isCreating = true; render();" class="bg-pink-500 text-white text-xs font-bold py-2.5 px-3.5 rounded-xl hover:bg-pink-600 transition shadow-sm flex items-center gap-1">
                <i data-lucide="plus" class="w-4 h-4"></i> 펀딩 개설
              </button>
            ` : ''}
          </div>

          <!-- 펀딩 카드 리스트 -->
          <div class="space-y-4">
            ${displayedList.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-dashed border-slate-200">
                <i data-lucide="gift" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
                <p class="text-sm">${currentTab === 'my' ? '등록한 내 펀딩이 없습니다.' : '등록된 펀딩이 없습니다.'}</p>
              </div>
            ` : displayedList.map(item => {
              const pct = Math.min(100, Math.round((item.currentAmount / item.targetAmount) * 100));
              const isOwner = currentUser && currentUser.uid === item.uid;

              return `
                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4 relative">
                  <div class="flex justify-between items-start">
                    <div>
                      <div class="flex items-center gap-2 mb-1">
                        <span class="inline-block ${item.status === 'closed' ? 'bg-slate-200 text-slate-600' : 'bg-pink-100 text-pink-600'} text-xs font-bold px-2.5 py-1 rounded-full">
                          ${item.status === 'closed' ? '종료됨' : '진행 중'}
                        </span>
                        <span class="text-xs text-slate-400">주최자: ${item.userName}</span>
                      </div>
                      <h3 class="text-lg font-bold text-slate-800">${item.title}</h3>
                    </div>
                    <div class="text-right">
                      <div class="text-xl font-bold text-pink-500">${pct}%</div>
                    </div>
                  </div>

                  <!-- 프로그레스 바 -->
                  <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div class="bg-pink-500 h-full transition-all duration-500" style="width: ${pct}%"></div>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500">
                    <span>현재 모금액: <strong>${item.currentAmount.toLocaleString()}원</strong></span>
                    <span>목표: ${item.targetAmount.toLocaleString()}원</span>
                  </div>

                  <!-- 하단 액션 버튼들 -->
                  <div class="pt-2 flex items-center justify-between border-t border-slate-100">
                    <button onclick="viewingDetailId = '${item.id}'; render();" class="text-xs font-bold text-pink-500 hover:underline flex items-center gap-1">
                      <i data-lucide="eye" class="w-3.5 h-3.5"></i> 상세 보기 및 후원하기
                    </button>

                    ${isOwner ? `
                      <div class="flex items-center gap-1.5">
                        <button onclick="editingFundingId = '${item.id}'; render();" class="text-xs text-slate-600 bg-slate-100 px-2.5 py-1.5 rounded-lg hover:bg-slate-200 transition">수정</button>
                        <button onclick="toggleCloseFunding('${item.id}', '${item.status || 'active'}')" class="text-xs text-amber-600 bg-amber-50 px-2.5 py-1.5 rounded-lg hover:bg-amber-100 transition">${item.status === 'closed' ? '재개' : '종료'}</button>
                        <button onclick="deleteFunding('${item.id}')" class="text-xs text-red-600 bg-red-50 px-2.5 py-1.5 rounded-lg hover:bg-red-100 transition">삭제</button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }
  </script>
</body>
</html>
