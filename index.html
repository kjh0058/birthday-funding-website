<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 선물 조르기 펀딩 | B-Day Funding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">
  <div id="app" class="max-w-xl mx-auto px-4 py-8"></div>

  <script>
    // Firebase 설정 정보 (발급받은 설정값으로 교체)
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Firebase 초기화 (설정값이 변경된 경우에만 실행)
    let db, auth;
    if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    }

    // 상태 관리
    let currentUser = null;
    let userFundings = [];
    let isCreating = false;

    // 초기화 및 이벤트 리스너
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      if (auth) {
        auth.onAuthStateChanged(user => {
          currentUser = user;
          if (user) {
            loadUserFundings();
          } else {
            render();
          }
        });
      } else {
        render();
      }
    });

    // 구글 로그인 처리
    async function loginWithGoogle() {
      if (!auth) {
        alert("Firebase 설정이 필요합니다. 안내 절차를 확인해 주세요!");
        return;
      }
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        alert("로그인 실패: " + err.message);
      }
    }

    // 로그아웃 처리
    async function logout() {
      if (auth) await auth.signOut();
      currentUser = null;
      userFundings = [];
      render();
    }

    // Firestore 데이터 불러오기
    async function loadUserFundings() {
      if (!db || !currentUser) return;
      const snapshot = await db.collection('fundings')
        .where('uid', '==', currentUser.uid)
        .orderBy('createdAt', 'desc')
        .get();
      
      userFundings = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      render();
    }

    // 펀딩 새로 생성하기
    async function createFunding(e) {
      e.preventDefault();
      const title = document.getElementById('giftTitle').value;
      const amount = parseInt(document.getElementById('giftAmount').value, 10);
      const bank = document.getElementById('bankName').value;
      const account = document.getElementById('accountNumber').value;
      const holder = document.getElementById('accountHolder').value;

      if (!title || !amount || !bank || !account) {
        alert("모든 필수 항목을 입력해 주세요.");
        return;
      }

      const newFunding = {
        uid: currentUser.uid,
        userName: currentUser.displayName || "익명",
        userEmail: currentUser.email,
        title,
        targetAmount: amount,
        currentAmount: 0,
        bankName: bank,
        accountNumber: account,
        accountHolder: holder,
        contributors: [],
        createdAt: new Date().toISOString()
      };

      if (db) {
        await db.collection('fundings').add(newFunding);
        await loadUserFundings();
      } else {
        userFundings.unshift({ id: Date.now().toString(), ...newFunding });
      }
      
      isCreating = false;
      render();
    }

    // 화면 렌더링
    function render() {
      const container = document.getElementById('app');
      
      if (!currentUser) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl shadow-xl p-8 text-center border border-slate-100">
            <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mx-auto mb-4 text-pink-500">
              <i data-lucide="gift" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 mb-2">생일 선물 펀딩 만들기</h1>
            <p class="text-slate-500 text-sm mb-6">구글 계정으로 로그인하여 나만의 생일 선물 펀딩을 생성하고 친구들에게 공유해 보세요!</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-semibold py-3 px-4 rounded-xl shadow-sm flex items-center justify-center gap-3 transition">
              <svg class="w-5 h-5" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
              Google 계정으로 시작하기
            </button>
          </div>
        `;
      } else if (isCreating) {
        container.innerHTML = `
          <div class="bg-white rounded-3xl shadow-xl p-8 border border-slate-100">
            <div class="flex items-center justify-between mb-6">
              <h2 class="text-xl font-bold text-slate-800">새 선물 펀딩 만들기</h2>
              <button onclick="isCreating = false; render();" class="text-slate-400 hover:text-slate-600">
                <i data-lucide="x" class="w-6 h-6"></i>
              </button>
            </div>
            <form onsubmit="createFunding(event)" class="space-y-4">
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">원하는 선물 이름</label>
                <input type="text" id="giftTitle" placeholder="예: 소니 헤드폰 WH-1000XM5" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500" required />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">선물 총 가격 (원)</label>
                <input type="number" id="giftAmount" placeholder="380000" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500" required />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">입금 받을 은행</label>
                  <input type="text" id="bankName" placeholder="카카오뱅크" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500" required />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-500 mb-1">예금주</label>
                  <input type="text" id="accountHolder" placeholder="김지홍" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500" required />
                </div>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-500 mb-1">계좌번호</label>
                <input type="text" id="accountNumber" placeholder="3333-01-2345678" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-pink-500" required />
              </div>
              <div class="pt-4 flex gap-3">
                <button type="button" onclick="isCreating = false; render();" class="w-1/2 bg-slate-100 text-slate-600 font-medium py-3 rounded-xl hover:bg-slate-200 transition">취소</button>
                <button type="submit" class="w-1/2 bg-pink-500 text-white font-semibold py-3 rounded-xl hover:bg-pink-600 shadow-md shadow-pink-200 transition">게시하기</button>
              </div>
            </form>
          </div>
        `;
      } else {
        container.innerHTML = `
          <div class="space-y-6">
            <!-- 사용자 프로필 상단바 -->
            <div class="bg-white rounded-2xl p-4 shadow-sm border border-slate-100 flex items-center justify-between">
              <div class="flex items-center gap-3">
                <img src="${currentUser.photoURL || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full border" />
                <div>
                  <div class="font-bold text-slate-800 text-sm">${currentUser.displayName || '사용자'}</div>
                  <div class="text-xs text-slate-400">${currentUser.email}</div>
                </div>
              </div>
              <button onclick="logout()" class="text-xs text-slate-500 hover:text-slate-800 underline">로그아웃</button>
            </div>

            <!-- 대시보드 메인 -->
            <div class="flex items-center justify-between">
              <h2 class="text-xl font-bold text-slate-800">내 펀딩 목록</h2>
              <button onclick="isCreating = true; render();" class="bg-pink-500 text-white text-xs font-bold py-2.5 px-4 rounded-xl hover:bg-pink-600 transition shadow-sm flex items-center gap-1.5">
                <i data-lucide="plus" class="w-4 h-4"></i> 새 펀딩 등록
              </button>
            </div>

            <!-- 펀딩 리스트 -->
            ${userFundings.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-dashed border-slate-200">
                <i data-lucide="gift" class="w-10 h-10 mx-auto mb-2 text-slate-300"></i>
                <p class="text-sm">아직 게시한 펀딩이 없습니다.<br>'새 펀딩 등록' 버튼을 눌러보세요!</p>
              </div>
            ` : userFundings.map(item => {
              const pct = Math.min(100, Math.round((item.currentAmount / item.targetAmount) * 100));
              return `
                <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4">
                  <div class="flex justify-between items-start">
                    <div>
                      <span class="inline-block bg-pink-100 text-pink-600 text-xs font-bold px-2.5 py-1 rounded-full mb-1">진행 중</span>
                      <h3 class="text-lg font-bold text-slate-800">${item.title}</h3>
                    </div>
                    <div class="text-right">
                      <div class="text-lg font-bold text-pink-500">${pct}%</div>
                    </div>
                  </div>

                  <!-- 프로그레스 바 -->
                  <div class="w-full bg-slate-100 rounded-full h-3 overflow-hidden">
                    <div class="bg-pink-500 h-full transition-all duration-500" style="width: ${pct}%"></div>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500 pt-1">
                    <span>모인 금액: <strong>${item.currentAmount.toLocaleString()}원</strong></span>
                    <span>목표: ${item.targetAmount.toLocaleString()}원</span>
                  </div>

                  <!-- 계좌 정보 -->
                  <div class="bg-slate-50 p-3 rounded-xl text-xs text-slate-600 flex justify-between items-center">
                    <div>
                      <span class="font-bold text-slate-700">${item.bankName}</span> ${item.accountNumber} (${item.accountHolder})
                    </div>
                    <button onclick="navigator.clipboard.writeText('${item.accountNumber}'); alert('계좌번호가 복사되었습니다!');" class="text-pink-500 hover:underline">복사</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
