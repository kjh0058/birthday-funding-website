<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>생일 선물 조르기 펀딩 | B-Day Funding</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans pb-16">
  <div id="app" class="max-w-xl mx-auto px-4 py-8"></div>

  <script>
    // Firebase 설정 정보
    const firebaseConfig = {
      apiKey: "AIzaSyDHWpJ8cgpXoB2z04tUFxOLCQz5CH93vbU",
      authDomain: "birthday-funding-76521.firebaseapp.com",
      databaseURL: "https://birthday-funding-76521-default-rtdb.firebaseio.com",
      projectId: "birthday-funding-76521",
      storageBucket: "birthday-funding-76521.firebasestorage.app",
      messagingSenderId: "623358878820",
      appId: "1:623358878820:web:8f502ff6729295de18eb71",
      measurementId: "G-63BJFBH2WV"
    };

    let db, auth;
    try {
      firebase.initializeApp(firebaseConfig);
      auth = firebase.auth();
      db = firebase.firestore();
    } catch (e) {
      console.error("Firebase 초기화 에러:", e);
    }

    let currentUser = null;
    let allFundings = [];
    let currentTab = 'all'; 
    let viewMode = 'list'; 
    let targetFunding = null;
    let uploadedImageBase64 = ""; // 업로드된 이미지 임시 저장

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      
      const urlParams = new URLSearchParams(window.location.search);
      const sharedId = urlParams.get('id');

      if (auth) {
        auth.onAuthStateChanged(async (user) => {
          currentUser = user;
          await fetchFundings();
          if (sharedId) {
            const found = allFundings.find(f => f.id === sharedId);
            if (found) {
              targetFunding = found;
              viewMode = 'detail';
              render();
            }
          }
        });
      } else {
        fetchFundings();
      }
    });

    async function loginGoogle() {
      if (!auth) return alert("Firebase 인증을 사용할 수 없습니다.");
      try {
        await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
      } catch (err) {
        alert("로그인 실패: " + err.message);
      }
    }

    async function logout() {
      if (auth) await auth.signOut();
      currentUser = null;
      viewMode = 'list';
      render();
    }

    async function fetchFundings() {
      if (!db) return;
      try {
        const snap = await db.collection('fundings').get();
        allFundings = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      } catch (err) {
        console.error("데이터 로드 실패:", err);
        allFundings = [];
      }
      render();
    }

    // 이미지 파일을 Base64로 변환하는 함수
    function handleImageUpload(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        // 이미지 압축/사이즈 조절을 위한 캔버스 처리
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          const MAX_WIDTH = 600;
          const MAX_HEIGHT = 600;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }
          canvas.width = width;
          canvas.height = height;
          ctx.drawImage(img, 0, 0, width, height);
          uploadedImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
          alert("사진이 성공적으로 첨부되었습니다!");
        };
        img.src = uploadEvent.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function handleCreate(e) {
      e.preventDefault();
      if (!currentUser) return alert("로그인이 필요합니다.");

      const title = document.getElementById('title').value;
      const shopUrl = document.getElementById('shopUrl').value;
      const targetAmount = parseInt(document.getElementById('targetAmount').value, 10);
      const bankName = document.getElementById('bankName').value;
      const accountHolder = document.getElementById('accountHolder').value;
      const accountNumber = document.getElementById('accountNumber').value;

      if (!title || !targetAmount || !bankName || !accountNumber) {
        return alert("필수 항목을 입력해주세요.");
      }

      const newFunding = {
        uid: currentUser.uid,
        userName: currentUser.displayName || "익명",
        title,
        imageUrl: uploadedImageBase64 || "",
        shopUrl: shopUrl || "",
        targetAmount,
        currentAmount: 0,
        status: 'active',
        bankName,
        accountHolder,
        accountNumber,
        contributors: [],
        createdAt: new Date().toISOString()
      };

      try {
        await db.collection('fundings').add(newFunding);
        uploadedImageBase64 = "";
        await fetchFundings();
        viewMode = 'list';
      } catch (err) {
        alert("생성 실패: " + err.message);
      }
      render();
    }

    async function handleUpdate(e, id) {
      e.preventDefault();
      const title = document.getElementById('editTitle').value;
      const shopUrl = document.getElementById('editShopUrl').value;
      const targetAmount = parseInt(document.getElementById('editAmount').value, 10);
      const bankName = document.getElementById('editBank').value;
      const accountHolder = document.getElementById('editHolder').value;
      const accountNumber = document.getElementById('editAccount').value;

      const existingItem = allFundings.find(f => f.id === id);
      const finalImageUrl = uploadedImageBase64 || (existingItem ? existingItem.imageUrl : "");

      try {
        await db.collection('fundings').doc(id).update({
          title, 
          imageUrl: finalImageUrl, 
          shopUrl, 
          targetAmount, 
          bankName, 
          accountHolder, 
          accountNumber
        });
        uploadedImageBase64 = "";
        await fetchFundings();
        viewMode = 'list';
        targetFunding = null;
      } catch (err) {
        alert("수정 실패: " + err.message);
      }
      render();
    }

    async function toggleStatus(id, currentStatus) {
      const next = currentStatus === 'closed' ? 'active' : 'closed';
      if (!confirm(`펀딩을 ${next === 'closed' ? '종료' : '재개'}하시겠습니까?`)) return;
      try {
        await db.collection('fundings').doc(id).update({ status: next });
        await fetchFundings();
      } catch (err) {
        alert("상태 변경 실패: " + err.message);
      }
      render();
    }

    async function removeFunding(id) {
      if (!confirm("정말 삭제하시겠습니까?")) return;
      try {
        await db.collection('fundings').doc(id).delete();
        await fetchFundings();
      } catch (err) {
        alert("삭제 실패: " + err.message);
      }
      render();
    }

    async function addContribute(e, id) {
      e.preventDefault();
      const name = document.getElementById('cName').value;
      const amount = parseInt(document.getElementById('cAmount').value, 10);
      const message = document.getElementById('cMsg').value || "축하해!";

      if (!name || !amount) return alert("이름과 금액을 입력해주세요.");

      const ref = db.collection('fundings').doc(id);
      try {
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(ref);
          if (!doc.exists) throw new Error("펀딩이 존재하지 않습니다.");
          const data = doc.data();
          const contributors = data.contributors || [];

          contributors.push({
            id: Date.now().toString(),
            name, 
            amount, 
            message, 
            status: 'pending', 
            uid: currentUser ? currentUser.uid : 'guest',
            createdAt: new Date().toISOString()
          });

          transaction.update(ref, { contributors });
        });
        alert("후원이 신청되었습니다! 주최자가 입금 확인 후 메시지가 등록됩니다.");
        await fetchFundings();
        targetFunding = allFundings.find(f => f.id === id);
      } catch (err) {
        alert("후원 실패: " + err.message);
      }
      render();
    }

    async function handleApproveContribute(fundingId, contributorId, isApproved) {
      const ref = db.collection('fundings').doc(fundingId);
      try {
        await db.runTransaction(async (transaction) => {
          const doc = await transaction.get(ref);
          if (!doc.exists) throw new Error("펀딩이 존재하지 않습니다.");
          const data = doc.data();
          let contributors = data.contributors || [];
          let currentAmount = data.currentAmount || 0;

          const targetIdx = contributors.findIndex(c => c.id === contributorId);
          if (targetIdx === -1) return;

          if (isApproved) {
            contributors[targetIdx].status = 'approved';
            currentAmount += contributors[targetIdx].amount;
          } else {
            contributors.splice(targetIdx, 1);
          }

          transaction.update(ref, { currentAmount, contributors });
        });

        alert(isApproved ? "후원 및 메시지가 승인되었습니다!" : "후원 신청을 거절했습니다.");
        await fetchFundings();
        targetFunding = allFundings.find(f => f.id === fundingId);
      } catch (err) {
        alert("처리에 실패했습니다: " + err.message);
      }
      render();
    }

    function copyShareLink(id) {
      const shareUrl = `${window.location.origin}${window.location.pathname}?id=${id}`;
      navigator.clipboard.writeText(shareUrl).then(() => {
        alert("펀딩 상세 페이지 링크가 복사되었습니다!\n친구들에게 공유해 보세요.");
      }).catch(() => {
        alert("링크 복사에 실패했습니다.");
      });
    }

    function render() {
      const app = document.getElementById('app');

      // 1. 상세 페이지
      if (viewMode === 'detail' && targetFunding) {
        const item = allFundings.find(f => f.id === targetFunding.id) || targetFunding;
        const isOwner = currentUser && currentUser.uid === item.uid;
        
        const rawPct = Math.round((item.currentAmount / item.targetAmount) * 100);
        const barPct = Math.min(100, rawPct);
        const overPct = rawPct > 100 ? rawPct - 100 : 0;

        const approvedContributors = (item.contributors || []).filter(c => c.status === 'approved');
        const pendingContributors = (item.contributors || []).filter(c => c.status === 'pending');

        app.innerHTML = `
          <div class="space-y-6">
            <div class="flex justify-between items-center">
              <button onclick="viewMode='list'; window.history.replaceState({}, '', window.location.pathname); render();" class="text-xs font-bold text-slate-500 flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> 목록으로
              </button>
              <button onclick="copyShareLink('${item.id}')" class="bg-slate-800 text-white text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1.5 shadow-sm">
                <i data-lucide="share-2" class="w-3.5 h-3.5"></i> 링크 공유
              </button>
            </div>

            <div class="bg-white rounded-3xl shadow-md border border-slate-100 overflow-hidden space-y-4 pb-6">
              <!-- 선물 대표 이미지 -->
              ${item.imageUrl ? `
                <div class="w-full h-64 bg-slate-100 relative">
                  <img src="${item.imageUrl}" class="w-full h-full object-cover" />
                </div>
              ` : ''}

              <div class="px-6 space-y-4">
                <div class="flex justify-between items-start">
                  <div>
                    <span class="text-xs font-bold px-2.5 py-1 rounded-full ${item.status === 'closed' ? 'bg-slate-200 text-slate-600' : 'bg-pink-100 text-pink-600'}">
                      ${item.status === 'closed' ? '종료됨' : '진행 중'}
                    </span>
                    <h2 class="text-xl font-bold text-slate-800 mt-2">${item.title}</h2>
                    <p class="text-xs text-slate-400">주최자: ${item.userName}</p>
                  </div>
                  <div class="text-right">
                    <div class="text-xl font-bold text-pink-500">${rawPct}%</div>
                    ${overPct > 0 ? `<div class="text-xs font-bold text-purple-600">(${overPct}% 초과 달성! 🎉)</div>` : ''}
                    <div class="text-xs text-slate-400 mt-1">${item.currentAmount.toLocaleString()}원 / ${item.targetAmount.toLocaleString()}원</div>
                  </div>
                </div>

                <!-- 프로그레스 바 -->
                <div class="w-full bg-slate-100 rounded-full h-3.5 overflow-hidden">
                  <div class="bg-pink-500 h-full transition-all duration-300" style="width: ${barPct}%"></div>
                </div>

                <!-- 쇼핑몰 바로가기 버튼 -->
                ${item.shopUrl ? `
                  <a href="${item.shopUrl}" target="_blank" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 px-4 rounded-2xl flex items-center justify-center gap-2 text-xs transition shadow-sm">
                    <i data-lucide="external-link" class="w-4 h-4"></i> 원하는 상품 보러 가기 (쇼핑몰 이동)
                  </a>
                ` : ''}

                <div class="bg-pink-50 border border-pink-100 p-4 rounded-2xl flex justify-between items-center text-xs">
                  <div>
                    <span class="font-bold text-pink-700">입금 계좌:</span> ${item.bankName} ${item.accountNumber} (${item.accountHolder})
                  </div>
                  <button onclick="navigator.clipboard.writeText('${item.accountNumber}'); alert('계좌번호가 복사되었습니다!');" class="bg-pink-500 text-white px-3 py-1.5 rounded-lg">계좌 복사</button>
                </div>

                <!-- 주최자 전용: 입금 확인 승인 대기 목록 -->
                ${isOwner && pendingContributors.length > 0 ? `
                  <div class="bg-amber-50 border border-amber-200 p-4 rounded-2xl space-y-3">
                    <h3 class="font-bold text-xs text-amber-800 flex items-center gap-1">
                      <i data-lucide="clock" class="w-4 h-4"></i> 입금 확인 대기 중인 신청 (${pendingContributors.length}건)
                    </h3>
                    <div class="space-y-2">
                      ${pendingContributors.map(c => `
                        <div class="bg-white p-3 rounded-xl border border-amber-100 flex justify-between items-center text-xs">
                          <div>
                            <span class="font-bold text-slate-800">${c.name}</span> (${c.amount.toLocaleString()}원)
                            <p class="text-slate-500 mt-0.5">"${c.message}"</p>
                          </div>
                          <div class="flex gap-1">
                            <button onclick="handleApproveContribute('${item.id}', '${c.id}', true)" class="bg-emerald-500 text-white px-2.5 py-1 rounded-lg font-bold">승인</button>
                            <button onclick="handleApproveContribute('${item.id}', '${c.id}', false)" class="bg-slate-200 text-slate-600 px-2 py-1 rounded-lg">거절</button>
                          </div>
                        </div>
                      `).join('')}
                    </div>
                  </div>
                ` : ''}

                <!-- 승인된 메시지 목록 -->
                <div class="space-y-2">
                  <h3 class="font-bold text-xs text-slate-700">축하 메시지 목록</h3>
                  <div class="space-y-2 max-h-48 overflow-y-auto">
                    ${approvedContributors.length === 0 ? `
                      <p class="text-xs text-slate-400 text-center py-4 bg-slate-50 rounded-xl">아직 승인된 메시지가 없습니다.</p>
                    ` : approvedContributors.map(c => `
                      <div class="bg-slate-50 p-3 rounded-xl flex justify-between items-center text-xs">
                        <div>
                          <span class="font-bold text-slate-700">${c.name}</span>: "${c.message}"
                        </div>
                        <div>
                          ${isOwner ? `<span class="font-bold text-pink-500">${c.amount.toLocaleString()}원</span>` : `<span class="text-slate-400">후원 완료 🎁</span>`}
                        </div>
                      </div>
                    `).join('')}
                  </div>
                </div>

                <!-- 후원 신청 폼 -->
                ${item.status !== 'closed' ? `
                  <form onsubmit="addContribute(event, '${item.id}')" class="bg-slate-50 p-4 rounded-2xl space-y-2 text-xs border border-slate-200">
                    <div class="font-bold text-slate-700 mb-1">펀딩 참여하고 메시지 남기기</div>
                    <div class="grid grid-cols-2 gap-2">
                      <input type="text" id="cName" placeholder="이름" class="p-2 border rounded-xl bg-white" required />
                      <input type="number" id="cAmount" placeholder="송금한 금액 (원)" class="p-2 border rounded-xl bg-white" required />
                    </div>
                    <input type="text" id="cMsg" placeholder="축하 메시지 입력" class="w-full p-2 border rounded-xl bg-white" />
                    <p class="text-[10px] text-slate-400">* 계좌로 입금 후 신청하시면 주최자 확인 후 메시지가 게재됩니다.</p>
                    <button type="submit" class="w-full bg-pink-500 text-white font-bold py-2.5 rounded-xl">송금 완료 후 승인 신청</button>
                  </form>
                ` : ''}
              </div>
            </div>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 2. 수정 페이지
      if (viewMode === 'edit' && targetFunding) {
        const item = targetFunding;
        app.innerHTML = `
          <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-bold">펀딩 수정하기</h2>
              <button onclick="viewMode='list'; render();" class="text-slate-400">✕</button>
            </div>
            <form onsubmit="handleUpdate(event, '${item.id}')" class="space-y-3 text-xs">
              <div><label>선물 이름</label><input type="text" id="editTitle" value="${item.title}" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div><label>선물 사진 파일 변경 (선택)</label><input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full p-2 border rounded-xl mt-1 text-[11px]" /></div>
              <div><label>쇼핑 사이트 링크 (URL)</label><input type="url" id="editShopUrl" value="${item.shopUrl || ''}" placeholder="https://www.coupang.com/..." class="w-full p-2.5 border rounded-xl mt-1" /></div>
              <div><label>목표 금액</label><input type="number" id="editAmount" value="${item.targetAmount}" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div class="grid grid-cols-2 gap-2">
                <div><label>은행</label><input type="text" id="editBank" value="${item.bankName}" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
                <div><label>예금주</label><input type="text" id="editHolder" value="${item.accountHolder}" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              </div>
              <div><label>계좌번호</label><input type="text" id="editAccount" value="${item.accountNumber}" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div class="pt-2 flex gap-2">
                <button type="button" onclick="viewMode='list'; render();" class="w-1/2 bg-slate-100 py-2.5 rounded-xl">취소</button>
                <button type="submit" class="w-1/2 bg-pink-500 text-white py-2.5 rounded-xl font-bold">저장</button>
              </div>
            </form>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 3. 생성 페이지
      if (viewMode === 'create') {
        app.innerHTML = `
          <div class="bg-white rounded-3xl p-6 shadow-md border border-slate-100 space-y-4">
            <div class="flex justify-between items-center">
              <h2 class="text-lg font-bold">새 펀딩 만들기</h2>
              <button onclick="viewMode='list'; uploadedImageBase64=''; render();" class="text-slate-400">✕</button>
            </div>
            <form onsubmit="handleCreate(event)" class="space-y-3 text-xs">
              <div><label>선물 이름</label><input type="text" id="title" placeholder="예: 아이패드 에어" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div><label>선물 사진 파일 업로드</label><input type="file" accept="image/*" onchange="handleImageUpload(event)" class="w-full p-2 border rounded-xl mt-1 text-[11px]" /></div>
              <div><label>쇼핑 사이트 링크 (URL, 쿠팡 등)</label><input type="url" id="shopUrl" placeholder="https://www.coupang.com/vp/products/..." class="w-full p-2.5 border rounded-xl mt-1" /></div>
              <div><label>목표 금액 (원)</label><input type="number" id="targetAmount" placeholder="950000" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div class="grid grid-cols-2 gap-2">
                <div><label>은행</label><input type="text" id="bankName" placeholder="카카오뱅크" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
                <div><label>예금주</label><input type="text" id="accountHolder" placeholder="김지홍" class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              </div>
              <div><label>계좌번호</label><input type="text" id="accountNumber" placeholder="3333-..." class="w-full p-2.5 border rounded-xl mt-1" required /></div>
              <div class="pt-2 flex gap-2">
                <button type="button" onclick="viewMode='list'; uploadedImageBase64=''; render();" class="w-1/2 bg-slate-100 py-2.5 rounded-xl">취소</button>
                <button type="submit" class="w-1/2 bg-pink-500 text-white py-2.5 rounded-xl font-bold">등록하기</button>
              </div>
            </form>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      // 4. 메인 목록 페이지
      const list = currentTab === 'all' 
        ? allFundings 
        : allFundings.filter(f => currentUser && f.uid === currentUser.uid);

      app.innerHTML = `
        <div class="space-y-6">
          <div class="bg-white rounded-2xl p-4 shadow-sm border flex items-center justify-between">
            ${currentUser ? `
              <div class="flex items-center gap-3">
                <img src="${currentUser.photoURL || 'https://via.placeholder.com/40'}" class="w-10 h-10 rounded-full" />
                <div class="text-xs">
                  <div class="font-bold text-slate-800">${currentUser.displayName}님</div>
                  <div class="text-slate-400">${currentUser.email}</div>
                </div>
              </div>
              <button onclick="logout()" class="text-xs text-slate-500 underline">로그아웃</button>
            ` : `
              <span class="text-xs font-bold text-slate-700">로그인하고 펀딩을 시작해보세요!</span>
              <button onclick="loginGoogle()" class="bg-pink-500 text-white text-xs font-bold px-3 py-2 rounded-xl">구글 로그인</button>
            `}
          </div>

          <div class="flex justify-between items-center">
            <div class="flex gap-2">
              <button onclick="currentTab='all'; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold ${currentTab==='all' ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600'}">전체 펀딩</button>
              <button onclick="currentTab='my'; render();" class="px-3.5 py-2 rounded-xl text-xs font-bold ${currentTab==='my' ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600'}">내 펀딩</button>
            </div>
            ${currentUser ? `<button onclick="viewMode='create'; render();" class="bg-pink-500 text-white text-xs font-bold px-3.5 py-2.5 rounded-xl shadow-sm">+ 펀딩 개설</button>` : ''}
          </div>

          <div class="space-y-4">
            ${list.length === 0 ? `
              <div class="bg-white rounded-2xl p-8 text-center text-slate-400 border border-dashed">
                <p class="text-xs">등록된 펀딩이 없습니다.</p>
              </div>
            ` : list.map(item => {
              const rawPct = Math.round((item.currentAmount / item.targetAmount) * 100);
              const barPct = Math.min(100, rawPct);
              const overPct = rawPct > 100 ? rawPct - 100 : 0;
              const isOwner = currentUser && currentUser.uid === item.uid;

              return `
                <div class="bg-white rounded-3xl p-6 shadow-md border space-y-3">
                  <div class="flex justify-between items-start">
                    <div>
                      <span class="text-xs font-bold px-2.5 py-1 rounded-full ${item.status === 'closed' ? 'bg-slate-200 text-slate-600' : 'bg-pink-100 text-pink-600'}">
                        ${item.status === 'closed' ? '종료됨' : '진행 중'}
                      </span>
                      <h3 class="text-base font-bold text-slate-800 mt-1.5">${item.title}</h3>
                      <p class="text-xs text-slate-400">주최자: ${item.userName}</p>
                    </div>
                    <div class="text-right">
                      <div class="text-lg font-bold text-pink-500">${rawPct}%</div>
                      ${overPct > 0 ? `<div class="text-[10px] font-bold text-purple-600">(${overPct}% 초과)</div>` : ''}
                    </div>
                  </div>

                  <div class="w-full bg-slate-100 rounded-full h-2.5 overflow-hidden">
                    <div class="bg-pink-500 h-full" style="width: ${barPct}%"></div>
                  </div>

                  <div class="flex justify-between text-xs text-slate-500">
                    <span>모금액: <strong>${item.currentAmount.toLocaleString()}원</strong></span>
                    <span>목표: ${item.targetAmount.toLocaleString()}원</span>
                  </div>

                  <div class="pt-2 flex justify-between items-center border-t border-slate-100 text-xs">
                    <button onclick="targetFunding=${JSON.stringify(item).replace(/"/g, '&quot;')}; viewMode='detail'; render();" class="font-bold text-pink-500 flex items-center gap-1">
                      상세보기 및 후원하기 →
                    </button>
                    ${isOwner ? `
                      <div class="flex gap-1">
                        <button onclick="targetFunding=${JSON.stringify(item).replace(/"/g, '&quot;')}; viewMode='edit'; render();" class="bg-slate-100 px-2.5 py-1 rounded-lg">수정</button>
                        <button onclick="toggleStatus('${item.id}', '${item.status || 'active'}')" class="bg-amber-50 text-amber-700 px-2.5 py-1 rounded-lg">${item.status === 'closed' ? '재개' : '종료'}</button>
                        <button onclick="removeFunding('${item.id}')" class="bg-red-50 text-red-600 px-2.5 py-1 rounded-lg">삭제</button>
                      </div>
                    ` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      `;
      lucide.createIcons();
    }
  </script>
</body>
</html>
